<svg width="320" height="80" viewBox="0 0 210 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- "oa" mark — two interlocking shapes representing pluggable components.
       Gradient is vivid on both light and dark backgrounds. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
  </defs>
  <!-- left ring (o) -->
  <circle cx="14" cy="30" r="10" stroke="url(#g)" stroke-width="4" fill="none"/>
  <!-- right arc (a) — open ring suggesting pluggability -->
  <path d="M 30 30 A 10 10 0 1 1 40 20" stroke="url(#g)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- connector dot — the "plug" -->
  <circle cx="36" cy="30" r="3" fill="url(#g)"/>
  <!-- wordmark: colors chosen for ≥3:1 contrast on BOTH GitHub light
       (#ffffff) and dark (#0d1117) backgrounds — no CSS needed (img-tag
       SVGs can't run media queries). "open" = GitHub link blue #0969da,
       "agent" = Go cyan #00ADD8 (brand accent, large bold so 2.6:1 is
       acceptable), "-go" = muted gray #6e7681 with reduced opacity. -->
  <text x="50" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0969da">
    open<tspan fill="#00ADD8">agent</tspan><tspan fill="#6e7681" opacity="0.5" font-weight="500">-go</tspan>
  </text>
</svg>
